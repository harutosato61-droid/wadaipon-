<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン｜わだいぽん！</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="./css/style.css">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #fffaeb 0%, #ffeed1 100%);
  font-family: 'Zen Maru Gothic', Meiryo, 'Yu Gothic', sans-serif;
  color: #4a2c2a;
}
.login-header {
  flex: none;
  height: 56px;
  padding: 0 20px;
  background: #ffea9f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.login-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.login-logo img {
  height: 32px;
  width: auto;
}
.back-link {
  font-size: 13.5px;
  font-weight: 700;
  color: #4a2c2a;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.login-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px 48px;
}
.login-card {
  width: 100%;
  max-width: 440px;
  padding: 40px 28px 36px;
  border-radius: 32px;
  background: #fff;
  box-shadow: 0 12px 36px rgba(0,0,0,0.14);
  text-align: center;
  box-sizing: border-box;
}
.login-title {
  margin: 0 0 10px;
  font-size: 24px;
  font-weight: 900;
  color: #111;
  letter-spacing: 0.5px;
}
.login-sub {
  margin: 0 0 32px;
  font-size: 13.5px;
  line-height: 1.8;
  color: #6b4a3a;
}
.login-btns {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  margin-bottom: 24px;
}
.login-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  max-width: 320px;
  min-height: 54px;
  padding: 0 24px;
  border: 0;
  border-radius: 27px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  transition: transform 0.1s, filter 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.login-btn:hover {
  filter: brightness(0.97);
}
.login-btn:active {
  transform: scale(0.98);
}
.login-btn.google {
  background: #fff;
  color: #111;
  border: 1.5px solid #e2e4e8;
}
.login-btn.discord {
  background: #5865F2;
  color: #fff;
}
.login-footer-note {
  margin: 20px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: #8c6a5a;
}
.user-panel {
  display: none;
}
.user-avatar-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.user-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: #ffea9f;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color: #4a2c2a;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.home-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 32px;
  border: 0;
  border-radius: 24px;
  background: #ffdf5c;
  color: #111;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.logout-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 20px;
  margin-top: 14px;
  border: 0;
  border-radius: 20px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
#auth-msg {
  display: none;
  margin-bottom: 16px;
  padding: 10px 14px;
  border-radius: 12px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 13px;
  font-weight: 700;
}
</style>
</head>
<body>

<header class="login-header">
  <a class="login-logo" href="./">
    <img src="./assets/71b719b9245d8a863fe940a97056536b.png" alt="わだいぽん！">
  </a>
  <a class="back-link" href="./">← ホームに戻る</a>
</header>

<main class="login-main">
  <div class="login-card">
    <div id="auth-msg"></div>

    <!-- 未ログイン時の表示 -->
    <div id="guest-panel">
      <h1 class="login-title">ログイン</h1>
      <p class="login-sub">ログインすると、お気に入りの同期や<br>お題の投稿ができるようになります。</p>

      <div class="login-btns">
        <button type="button" class="login-btn google" id="btn-google">
          <svg width="22" height="22" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Googleでログイン</span>
        </button>

        <button type="button" class="login-btn discord" id="btn-discord">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Discordでログイン</span>
        </button>
      </div>

      <p class="login-footer-note">※アカウント情報はログイン認証とお気に入り等の機能のみに使用されます。</p>
    </div>

    <!-- ログイン済みの表示 -->
    <div id="user-panel" class="user-panel">
      <div class="user-avatar-wrap">
        <div class="user-avatar" id="user-avatar">?</div>
      </div>
      <h1 class="login-title" id="user-name">ユーザー名</h1>
      <p class="login-sub">ログイン中です</p>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <a class="home-btn" href="./">ホームへ戻る</a>
        <button type="button" class="logout-btn" id="btn-logout">ログアウト</button>
      </div>
    </div>

  </div>
</main>

<script src="./js/supa-config.js"></script>
<script type="module">
import { supabase } from "./js/supa.js";

const guestPanel = document.getElementById("guest-panel");
const userPanel = document.getElementById("user-panel");
const userName = document.getElementById("user-name");
const userAvatar = document.getElementById("user-avatar");
const authMsg = document.getElementById("auth-msg");

const showMsg = (text) => {
  if (text) {
    authMsg.textContent = text;
    authMsg.style.display = "block";
  } else {
    authMsg.style.display = "none";
  }
};

const renderUser = (user) => {
  if (user) {
    guestPanel.style.display = "none";
    userPanel.style.display = "block";
    const m = user.user_metadata || {};
    const name = m.full_name || m.name || m.user_name || m.global_name || user.email || "ユーザー";
    const photo = m.avatar_url || m.picture || "";
    userName.textContent = name;
    if (photo) {
      userAvatar.textContent = "";
      userAvatar.style.backgroundImage = `url("${photo}")`;
    } else {
      userAvatar.style.backgroundImage = "";
      userAvatar.textContent = Array.from(name)[0] || "?";
    }
  } else {
    guestPanel.style.display = "block";
    userPanel.style.display = "none";
  }
};

if (window.WADAI_AUTH_API) {
  // すでに supa.js の state がある場合
  if (window.WADAI_AUTH && window.WADAI_AUTH.user) {
    renderUser(window.WADAI_AUTH.user);
  }
}

window.addEventListener("wadai-auth", (e) => {
  const st = e.detail || {};
  renderUser(st.user);
  if (st.error) showMsg(st.error);
});

document.getElementById("btn-google").addEventListener("click", () => {
  showMsg("");
  if (window.WADAI_AUTH_API) {
    window.WADAI_AUTH_API.login("google");
  }
});

document.getElementById("btn-discord").addEventListener("click", () => {
  showMsg("");
  if (window.WADAI_AUTH_API) {
    window.WADAI_AUTH_API.login("discord");
  }
});

document.getElementById("btn-logout").addEventListener("click", () => {
  if (window.WADAI_AUTH_API) {
    window.WADAI_AUTH_API.logout();
  }
});
</script>
</body>
</html>
